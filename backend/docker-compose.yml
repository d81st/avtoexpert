services:
  postgres:
    image: postgres:16-alpine
    container_name: avtoexpert-pro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: avtoexpert
    ports:
      - "5432:5432"
    volumes:
      - avtoexpert_pro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  avtoexpert_pro_postgres_data:
